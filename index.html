/* ============================================================
   DESIGN SYSTEM
   Reference canvas .......... 2000 x 1333.33  (3:2, = asset aspect)
   Asset ..................... 1536 x 1024
   Portal core (in asset px) . x 707.5 -> 831.5  (w 124)
                               y 453.5 -> 776.0  (h 322.5)
   --s  = scene scale  : screen px per ASSET px   (cover, +0.4% bleed)
   --k  = design scale : screen px per DESIGN px  (1.0 at reference)
   ============================================================ */
:root{
  --vh:100vh;

  /* cover scale for the scene. 1530x1020 (instead of 1536x1024) gives a
     6*s horizontal / 4*s vertical bleed so the -1.5*s portal-centering
     nudge can never expose an edge. */
  --s: max(calc(100vw / 1530), calc(var(--vh) / 1020));

  /* content scale, three constraints:
     1. --kfull  lock to the scene so the CTA always frames the portal
     2. --kfit   never let the headline exceed 90% of the viewport width
     3. --kvh    never let the stack outgrow a short viewport            */
  --kfull: calc(var(--s) * 0.765);
  --kfit:  calc(100vw * 0.90 / 1090);
  --kvh:   calc(var(--vh) / 1250);

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

.stage{

.scene{
  position:absolute; left:50%;

  height:calc(1024 * var(--s));

     viewport centre line (asset x 768). */

       page that never animated at all. */
    var c = document.querySelector('.cta');
    if (c) { c.style.display = 'none'; void c.offsetHeight; c.style.display = ''; }
  };
  addEventListener('animationend', function (e) {
    if (e.animationName === 'entPanel') done();
  });
  setTimeout(done, 2600);          /* backstop, well past the 1.55s finish */
})();
</script>

<script>
/* Tablet menu. CSS owns every layout decision; this only carries the
   state CSS cannot: aria-expanded, Escape, and focus movement. */
(function () {
  var nav  = document.querySelector('.nav'),
      btn  = document.querySelector('.burger'),
      menu = document.getElementById('primary-menu'),
      mq   = window.matchMedia('(max-width:1080px) and (max-aspect-ratio:0.91/1), (max-width:620px) and (min-height:480px)');

  function setOpen(open) {
    nav.classList.toggle('open', open);
    btn.setAttribute('aria-expanded', String(open));
    btn.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
    if (open) { var f = menu.querySelector('a'); if (f) f.focus(); }
  }

  btn.addEventListener('click', function () {
    var willOpen = !nav.classList.contains('open');
    setOpen(willOpen);
    if (!willOpen) btn.focus();
  });

  /* Follow a link, or click the backdrop, and the menu closes. */
  menu.addEventListener('click', function (e) {
    if (e.target.closest('a') || e.target === menu) setOpen(false);
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && nav.classList.contains('open')) { setOpen(false); btn.focus(); }
  });

  /* Leaving the tablet range must never strand the overlay open. */
  (mq.addEventListener ? mq.addEventListener.bind(mq, 'change') : mq.addListener.bind(mq))(
    function () { if (!mq.matches) setOpen(false); }
  );
})();
</script>
